name: Auto Daily Briefing 24h

on:
  schedule:
    # 22:30 UTC = 05:30 AM Giờ Việt Nam (GMT+7) hàng ngày
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Run Daily Briefing Pipeline
        run: |
          cd Gemini
          python3 main.py

      - name: Commit & Push to GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html Gemini/docs/ Gemini/output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bản tin 24h tự động (GitHub Actions) — 08/09/2026" && git push origin main)
