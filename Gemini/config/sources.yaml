      url: "https://www.hsx.vn"
      enabled: true
      weight: 30
    - name: "CafeF Market Data"
      url: "https://cafef.vn"
      enabled: true
      weight: 25
  fuel:
    - name: "Petrolimex Giá Xăng Dầu"
      url: "https://www.petrolimex.com.vn"
      enabled: true
      weight: 30

