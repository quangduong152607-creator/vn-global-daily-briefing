# Danh mục nguồn tin tức & dữ liệu hệ thống Bản tin 24h
# Phân chia khoa học theo 3 Tab chính:
# - Tab 1 (Trong nước): Kinh tế & Thị trường; Công nghệ trong nước (Tinhte, GenK, Số Hóa); Thị phần GfK & Counterpoint
# - Tab 2 (Quốc tế): Kinh tế & Địa chính trị thế giới (Reuters, BBC, CNBC); Công nghệ & Di động quốc tế (GSMArena, The Verge)
# - Tab 3 (Social): Google Trends VN; Showbiz & Tiêu điểm giải trí viral MXH

indices:
  gold:
    - name: "SJC Gold"
      url: "https://sjc.com.vn"
      enabled: true
      weight: 30
    - name: "Kitco World Gold"
      url: "https://www.kitco.com"
      enabled: true
      weight: 25
  forex:
