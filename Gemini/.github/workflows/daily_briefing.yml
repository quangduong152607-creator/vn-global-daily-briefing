name: Daily Market Briefing Pipeline (06:00 ICT)

on:
  schedule:
    # 23:00 UTC hàng ngày = 06:00 sáng giờ Việt Nam (UTC+7 / ICT)
    - cron: '0 23 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions trên GitHub

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Briefing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: 'Asia/Ho_Chi_Minh'
        run: |
          python main.py

      - name: Commit and Push Updated Briefing
        env:
          TZ: 'Asia/Ho_Chi_Minh'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ output/ index.html data/
          if git diff --staged --quiet; then
            echo "Khong co thay doi moi de commit."
          else
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
            git commit -m "chore(briefing): tu dong cap nhat ban tin ngay ${TIMESTAMP} ICT [skip ci]"
            git push
          fi
